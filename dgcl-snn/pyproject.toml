[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dgcl-snn"
version = "1.0.0"
description = "Per-sample plasticity control for continual learning in spiking neural networks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Madhusudhan Dudapu" }]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.23",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[tool.setuptools]
packages = ["dgcl_snn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# I (input current) and O (Omega) follow the notation of the thesis.
ignore = ["E741"]
